name: 'Upload Code Coverage'
description: 'Upload a Cobertura XML coverage report to GitHub code coverage API'

inputs:
  file:
    description: 'Path to the Cobertura XML coverage report'
    required: true
  language:
    description: 'Linguist language name (e.g. "Java", "Go", "Python")'
    required: true
  label:
    description: 'Label for the coverage report (e.g. "code-coverage/jacoco")'
    required: true
  fail-on-error:
    description: 'Whether to fail the workflow step if the upload fails (set to false to treat upload errors as warnings)'
    required: false
    default: 'true'
  wait-for-processing-timeout:
    description: 'How many seconds to wait for coverage report processing before failing the step. Set to 0 to disable waiting'
    required: false
    default: '160'
  token:
    description: 'GitHub token with code-quality:write permission'
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Upload coverage report
      shell: bash -euo pipefail {0}
      env:
        COMMIT_OID: >-
          ${{
            case(
              github.event_name == 'pull_request' || github.event_name == 'pull_request_target',
              github.event.pull_request.head.sha,
              github.sha
            )
          }}
        GH_TOKEN: ${{ inputs.token }}
        INPUT_FILE: ${{ inputs.file }}
        INPUT_LANGUAGE: ${{ inputs.language }}
        INPUT_LABEL: ${{ inputs.label }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        WAIT_FOR_PROCESSING_TIMEOUT: ${{ inputs.wait-for-processing-timeout }}
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        PULL_REQUEST_HEAD_REPO_NAME: ${{ github.event.pull_request.head.repo.full_name }}
        REF: >-
          ${{
            case(
              github.event_name == 'pull_request' || github.event_name == 'pull_request_target',
              '',
              github.ref
            )
          }}
      run: |
        export GH_HOST="${GITHUB_SERVER_URL#*://}"

        if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
          echo "::warning::Skipping coverage upload for merge queue. Configure your workflow to upload coverage for PRs and the default branch instead. To avoid spinning up a runner, add \"if: github.event_name != 'merge_group'\" to the upload job."
          exit 0
        fi

        if [ "$PULL_REQUEST_HEAD_REPO_NAME" != "" ] && \
           [ "$PULL_REQUEST_HEAD_REPO_NAME" != "$GITHUB_REPOSITORY" ]; then
          echo "::notice::Skipping coverage upload for fork PR (from $PULL_REQUEST_HEAD_REPO_NAME)"
          exit 0
        fi

        if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_EVENT_NAME" != "pull_request_target" ]; then
          PR_NUMBER=$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head "$GITHUB_REF_NAME" \
            --state open \
            --json number \
            --jq '.[0].number // empty' 2>/dev/null || true)
        fi

        PR_NUMBER="$PR_NUMBER" \
        python3 "$GITHUB_ACTION_PATH/upload_coverage.py"

    - name: Post-step telemetry
      if: always() && env._COVERAGE_TELEMETRY_STARTED_AT != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        INPUT_LANGUAGE: ${{ inputs.language }}
        INPUT_LABEL: ${{ inputs.label }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        WAIT_FOR_PROCESSING_TIMEOUT: ${{ inputs.wait-for-processing-timeout }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_API_URL: ${{ github.api_url }}
        COMMIT_OID: ${{ github.event.pull_request.head.sha || github.sha }}
      run: python3 "$GITHUB_ACTION_PATH/post_upload_coverage.py"
