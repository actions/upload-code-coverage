[project]
name = "upload-code-coverage"
version = "0.1.0"
description = "GitHub Action to upload code coverage"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[dependency-groups]
dev = [
    "pyyaml>=6.0.3",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
