name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev
      - name: Run unit tests
        run: uv run python -m unittest test_upload_coverage.py test_status_report.py test_post_upload_coverage.py test_resolve_upload_context.py -v
